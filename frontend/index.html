<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskPulse</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body class="bg-light">

<div class="container mt-5">

  <div class="row justify-content-center">
    <div class="col-md-6">

      <div class="text-center mb-4">
        <h1>TaskPulse</h1>
        <p>Smart Student Planner with Social Accountability</p>
      </div>

      <!-- CHOICE BUTTONS -->
      <div class="d-flex justify-content-center gap-3 mb-4">
        <button class="btn btn-primary" onclick="showLogin()">Login</button>
        <button class="btn btn-success" onclick="showSignup()">Sign Up</button>
      </div>

      <!-- LOGIN FORM -->
      <div id="loginSection" class="card p-4 shadow" style="display:none;">
        <h3 class="mb-3">Login</h3>

        <input
          type="email"
          id="loginEmail"
          placeholder="Email"
          class="form-control mb-2"
        >

        <input
          type="password"
          id="loginPassword"
          placeholder="Password"
          class="form-control mb-3"
        >

        <button class="btn btn-primary" onclick="loginUser()">
          Login
        </button>
      </div>

      <!-- SIGNUP FORM -->
      <div id="signupSection" class="card p-4 shadow" style="display:none;">
        <h3 class="mb-3">Create Account</h3>

        <input
          type="text"
          id="signupName"
          placeholder="Full Name"
          class="form-control mb-2"
        >

        <input
          type="email"
          id="signupEmail"
          placeholder="Email"
          class="form-control mb-2"
        >

        <input
          type="password"
          id="signupPassword"
          placeholder="Password"
          class="form-control mb-3"
        >

        <button class="btn btn-success" onclick="signupUser()">
          Sign Up
        </button>
      </div>

    </div>
  </div>
</div>

<script src="auth.js"></script>

<script>
  function showLogin() {
    document.getElementById("loginSection").style.display = "block";
    document.getElementById("signupSection").style.display = "none";
  }

  function showSignup() {
    document.getElementById("signupSection").style.display = "block";
    document.getElementById("loginSection").style.display = "none";
  }

  function signupUser() {
    const name = document.getElementById("signupName").value;
    const email = document.getElementById("signupEmail").value;
    const password = document.getElementById("signupPassword").value;

    handleSignup(name, email, password);

    document.getElementById("signupName").value = "";
    document.getElementById("signupEmail").value = "";
    document.getElementById("signupPassword").value = "";
  }

  function loginUser() {
    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;

    handleLogin(email, password);
  }
</script>

</body>
</html>
