<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskPulse</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
</head>
<body class="bg-light" style="padding-top: 40px;">

<!----NAVBAR----->
<nav class="navbar fixed-top navbar-expand-lg navbar-dark bg-dark  bg-opacity-50">
  <div class="container">

    <a class="navbar-brand" href="#">
      TaskPulse
    </a>

    <div class="ms-auto d-flex gap-2">

      <a
        href="dashboard.html"
        class="btn btn-outline-light btn-sm"
      >
        Dashboard
      </a>

      <button
        class="btn btn-danger btn-sm"
        onclick="logoutUser()"
      >
        Logout
      </button>
    </div>
  </div>
</nav>
<!-----END NAVBAR------>

<div class="container mt-4">

  <h1 class="text-center mb-4">Task Dashboard</h1>

  <div class="row">

    <!-- LEFT COLUMN -->
    <div class="col-md-4">

      <div class="card p-4 shadow mb-4">
        <h3>Progress Overview</h3>

        <p>Total Tasks: <span id="totalTasks">0</span></p>
        <p>Completed: <span id="completedTasks">0</span></p>
        <p>Pending: <span id="pendingTasks">0</span></p>
        <p>Completion Rate: <span id="completionRate">0%</span></p>
      </div>

      <div class="card p-4 shadow">
        <h3>Smart Suggestions</h3>
        <p id="suggestions"></p>
      </div>

    </div>

    <!-- RIGHT COLUMN -->
    <div class="col-md-8">

      <div class="card p-4 shadow mb-4">
        <h3>Add New Task</h3>

        <form id="taskForm">

          <input
            type="text"
            id="title"
            placeholder="Task Title"
            class="form-control mb-2"
            required
          >

          <textarea
            id="description"
            placeholder="Task Description"
            class="form-control mb-2"
          ></textarea>

          <select
            id="priority"
            class="form-control mb-2"
            required
          >
            <option value="">Select Priority</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
          </select>

          <input
            type="datetime-local"
            id="deadline"
            class="form-control mb-3"
            required
          >

          <button class="btn btn-primary">
            Add Task
          </button>

        </form>
      </div>

      <div class="card p-4 shadow">
        <h3>My Tasks</h3>
        <div id="taskList"></div>
      </div>

    </div>

  </div>

</div>

<script src="dashboard.js"></script>
</body>
</html>
